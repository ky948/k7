name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
        run: npm run build

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN || secrets.WASMER_AUTH_TOKEN || secrets.WASMER_API_TOKEN || secrets.WAP_TOKEN || secrets.WASMER_KEY }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER || vars.WASMER_OWNER || 'ky948' }}
        run: |
          if [ -z "${WASMER_TOKEN}" ]; then
            echo "::error title=Missing WASMER_TOKEN::Secret WASMER_TOKEN is not configured in this repository. Please go to Settings > Secrets and variables > Actions > New repository secret, name it WASMER_TOKEN, and paste your token (starts with wap_)."
            echo "Instructions:"
            echo "1. Obtain token from https://wasmer.io/settings/tokens"
            echo "2. Add secret WASMER_TOKEN in GitHub repository settings"
            exit 1
          fi

          # Update version in wasmer.toml to prevent 'version already published' collision
          PKG_VERSION="0.1.${{ github.run_number }}"
          echo "Updating package version to ${PKG_VERSION} in wasmer.toml..."
          sed -i "s/^version = .*/version = \"${PKG_VERSION}\"/" wasmer.toml

          echo "Authenticating Wasmer CLI..."
          export WASMER_TOKEN="${WASMER_TOKEN}"
          wasmer login "${WASMER_TOKEN}" || true

          # Dynamically resolve active Wasmer account
          LOGGED_IN_USER=$(wasmer whoami 2>/dev/null | tr -d ' \r\n' || echo "")
          if [ -n "${LOGGED_IN_USER}" ]; then
            ACTUAL_OWNER="${LOGGED_IN_USER}"
            echo "Logged in as Wasmer user: ${ACTUAL_OWNER}"
          else
            ACTUAL_OWNER="${WASMER_OWNER}"
            echo "Using specified owner: ${ACTUAL_OWNER}"
          fi

          # Sync owner and package namespace to the actual authenticated account
          sed -i "s/^owner: .*/owner: ${ACTUAL_OWNER}/" app.yaml
          sed -i "s|^name = \".*/web-app\"|name = \"${ACTUAL_OWNER}/web-app\"|" wasmer.toml

          echo "Deploying app ky7 to Wasmer Edge under owner ${ACTUAL_OWNER}..."
          wasmer deploy --publish-package --owner="${ACTUAL_OWNER}" --no-persist-id --token="${WASMER_TOKEN}" || \
          wasmer deploy --owner="${ACTUAL_OWNER}" --no-persist-id --token="${WASMER_TOKEN}" || \
          wasmer deploy --publish-package --no-persist-id || \
          wasmer deploy --no-persist-id || \
          wasmer deploy
