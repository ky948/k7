name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
        run: npm run build

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v2

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER || vars.WASMER_OWNER || 'ky7' }}
        run: |
          if [ -z "${WASMER_TOKEN}" ]; then
            echo "::error::WASMER_TOKEN secret is missing or empty. Please add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deploying app ky7 to Wasmer Edge under owner ${WASMER_OWNER}..."
          wasmer deploy --publish-package --bump --owner="${WASMER_OWNER}" --token="${WASMER_TOKEN}" --non-interactive || \
          wasmer deploy --owner="${WASMER_OWNER}" --token="${WASMER_TOKEN}" --non-interactive || \
          wasmer app deploy --token="${WASMER_TOKEN}"
