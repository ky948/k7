name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
        run: npm run build

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v2

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_OWNER: ${{ secrets.WASMER_OWNER || vars.WASMER_OWNER || 'ky7' }}
        run: |
          wasmer deploy --publish-package --owner="${WASMER_OWNER}" --no-persist-id --token="${WASMER_TOKEN}"
